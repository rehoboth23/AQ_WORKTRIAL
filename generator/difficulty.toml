# Difficulty knobs for the task generator (read by generator/config.py). Env vars override
# them (e.g. MIN_FAULTS=4). Values are measured from the hand-built reference task
# reference/petrify-stale-build: 5 interacting faults across code, data and config; 1,246
# non-blank environment lines; a 62-line solution; 1 test value repeated in the instruction;
# agents first diagnosed a fault at step 3-6, with 2-8 steps between later diagnoses.

[knobs]
# Specification tasks (2026-10-22): the agent must satisfy every stated rule; difficulty comes
# from breadth (min_rules..max_rules independent rules over min_themes themes), not hidden faults.
min_rules = 12
max_rules = 20
min_themes = 4
# Judgement genre: sites violating the stated property, each with a distinct mechanism.
min_sites = 3
max_sites = 6
# Existing behaviours the instruction does not enumerate but hidden regression tests check.
min_preserved = 3
# Hidden-fault genre knobs, retired (every such task scored 4-5/5); kept so old records parse.
# One central challenge with a few faults that all serve it (2026-10-21): a 5-fault quota
# produced filler bugs (wrong interpreter path, main() never called) that add steps, not
# difficulty; 7 faults in 4 layers still scored 4/4. Layers are no longer required.
min_faults = 2
max_faults = 4
min_fault_layers = 1
# No size floors (environment lines or solve.sh lines): size was never a difficulty lever, and
# the floors only made glm pad the code or the fix.
max_leaked_literals = 1
critic_found_within = 3

# Spacing between the critic's estimated fault discoveries (agent steps). Any gap < min_gap,
# or a first find before critic_found_within, is too easy and rejected. The median gap grades
# the design: >= hard_gap hard, >= very_hard_gap very hard, > too_hard_above too hard
# (flagged, not rejected).
[discovery]
min_gap = 2
hard_gap = 4
very_hard_gap = 7
too_hard_above = 9
timeout_risk_steps = 60

schema_version = "1.1"

[task]
name = "afterquery/timesheet-payroll-spec-converter"
description = "Update a timesheet-to-payroll converter to follow a detailed specification covering rounding, overtime tiers, week boundaries, timezone handling, and exact output layout."
keywords = [ "payroll", "rounding", "overtime", "timezone", "specification", "csv",]

[metadata]
difficulty = "hard"
category = "software-engineering"
tags = [ "payroll", "rounding", "overtime", "timezone", "specification", "csv",]
expert_time_estimate_min = 60.0
junior_time_estimate_min = 180.0
generator_model = "z-ai/glm-5.1"

[verifier]
timeout_sec = 900.0

[agent]
timeout_sec = 3600.0
network_mode = "no-network"

[environment]
build_timeout_sec = 600.0
cpus = 1
memory_mb = 2048
storage_mb = 10240

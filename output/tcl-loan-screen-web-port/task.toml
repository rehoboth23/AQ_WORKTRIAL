schema_version = "1.1"

[task]
name = "afterquery/tcl-loan-screen-web-port"
description = "Port a legacy Tcl/Tk loan-application screen to a Flask web app that preserves exact validation order, per-step rounding, last-instalment adjustment, and database record format."
keywords = [ "porting", "tcl", "flask", "validation", "rounding", "sqlite",]

[metadata]
difficulty = "hard"
category = "software-engineering"
tags = [ "porting", "tcl", "flask", "validation", "rounding", "sqlite",]
expert_time_estimate_min = 90.0
junior_time_estimate_min = 240.0
generator_model = "z-ai/glm-5.1"

[verifier]
timeout_sec = 900.0

[agent]
timeout_sec = 3600.0
network_mode = "no-network"

[environment]
build_timeout_sec = 600.0
cpus = 1
memory_mb = 2048
storage_mb = 10240

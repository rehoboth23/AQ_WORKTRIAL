schema_version = "1.1"

[task]
name = "afterquery/packing-slip-fixed-width-renderer"
description = "Build a packing-slip generator that renders fixed-width slips from an orders CSV with strict rules for grouping, quantities, weights, address blocks, page breaks, slip ordering, whitespace handling, and totals."
keywords = [ "cli", "formatting", "csv", "unicode", "rounding", "ordering",]

[metadata]
difficulty = "hard"
category = "software-engineering"
tags = [ "cli", "formatting", "csv", "unicode", "rounding", "ordering",]
expert_time_estimate_min = 55.0
junior_time_estimate_min = 140.0
generator_model = "z-ai/glm-5.1"

[verifier]
timeout_sec = 900.0

[agent]
timeout_sec = 3600.0
network_mode = "no-network"

[environment]
build_timeout_sec = 600.0
cpus = 1
memory_mb = 2048
storage_mb = 10240

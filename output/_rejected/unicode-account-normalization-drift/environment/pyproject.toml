[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "account-service"
version = "1.3.0"
description = "Account management service with web API, CLI, and bulk import/export"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
dependencies = [
    "flask>=3.0",
    "click>=8.1",
]

[project.scripts]
account-cli = "account_service.cli:cli"

[tool.setuptools.packages.find]
include = ["account_service*"]

schema_version = "1.1"

[task]
name = "afterquery/variable-star-lightcurve-reducer"
description = "Reduce raw light curves into calibrated magnitudes and period estimates for variable stars following observatory conventions, including alias rejection and comparison-star vetting."
keywords = [ "astronomy", "photometry", "period-analysis", "conventions", "alias-rejection",]

[metadata]
difficulty = "hard"
category = "data-processing"
tags = [ "astronomy", "photometry", "period-analysis", "conventions", "alias-rejection",]
expert_time_estimate_min = 90.0
junior_time_estimate_min = 240.0
generator_model = "z-ai/glm-5.1"

[verifier]
timeout_sec = 900.0

[agent]
timeout_sec = 3600.0
network_mode = "no-network"

[environment]
build_timeout_sec = 600.0
cpus = 1
memory_mb = 2048
storage_mb = 10240

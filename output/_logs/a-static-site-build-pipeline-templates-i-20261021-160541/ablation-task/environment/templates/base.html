<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}{{ site_name }}{% endblock %}</title>
    <link rel="stylesheet" href="{{ asset_prefix }}{{ asset_url('css/main.css') }}">
    <link rel="stylesheet" href="{{ asset_prefix }}{{ asset_url('css/syntax.css') }}">
    <link rel="stylesheet" href="{{ asset_prefix }}{{ asset_url('css/print.css') }}" media="print">
    <link rel="alternate" type="application/rss+xml" title="{{ site_name }} RSS Feed" href="feed.xml">
</head>
<body>
    {% include 'nav.html' %}
    <main>
        {% block content %}{% endblock %}
    </main>
    {% include 'footer.html' %}
    <script src="{{ asset_prefix }}{{ asset_url('js/app.js') }}"></script>
    <script src="{{ asset_prefix }}{{ asset_url('js/search.js') }}" defer></script>
</body>
</html>

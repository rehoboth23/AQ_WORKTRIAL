{% extends "base.html" %}

{% block title %}Archive — {{ site_name }}{% endblock %}

{% block content %}
<section class="archive">
    <h1>Post Archive</h1>
    {% for post in posts %}
    <article class="post archive-entry">
        <h3><a href="{{ post.url }}">{{ post.title }}</a></h3>
        <time datetime="{{ post.date }}">{{ post.date }}</time>
    </article>
    {% endfor %}
</section>
{% endblock %}

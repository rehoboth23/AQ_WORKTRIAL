junior_time_estimate_min = 100.0
generator_model = "z-ai/glm-5.1"

[verifier]
timeout_sec = 900.0

[agent]
timeout_sec = 3600.0
network_mode = "no-network"

[environment]
build_timeout_sec = 600.0
cpus = 1
memory_mb = 2048
storage_mb = 10240

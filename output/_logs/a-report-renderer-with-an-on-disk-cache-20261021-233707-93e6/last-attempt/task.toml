schema_version = "1.1"

[task]
name = "afterquery/stale-cached-report-renderer"
description = "Fix a report renderer whose on-disk cache serves stale output after changes to templates, reference data, or settings — including files that are created or deleted between runs"
keywords = [ "cache-invalidation", "lazy-registration", "conditional-loading", "report-generation",]

[metadata]
difficulty = "medium"
category = "debugging"
tags = [ "cache-invalidation", "lazy-registration", "conditional-loading", "report-generation",]

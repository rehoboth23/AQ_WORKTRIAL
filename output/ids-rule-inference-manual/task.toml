schema_version = "1.1"

[task]
name = "afterquery/ids-rule-inference-from-logs"
description = "Infer the exact decision rules of a retired IDS from labelled flow logs and reproduce its decisions on held-out flows."
keywords = [ "rule-induction", "boundary-inference", "ids", "timezone", "classification",]

[metadata]
difficulty = "hard"
category = "data-processing"
tags = [ "rule-induction", "boundary-inference", "ids", "timezone", "classification",]
expert_time_estimate_min = 90.0
junior_time_estimate_min = 240.0
generator_model = "z-ai/glm-5.1"

[verifier]
timeout_sec = 900.0

[agent]
timeout_sec = 3600.0
network_mode = "no-network"

[environment]
build_timeout_sec = 600.0
cpus = 1
memory_mb = 2048
storage_mb = 10240

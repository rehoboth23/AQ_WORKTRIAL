schema_version = "1.1"

[task]
name = "afterquery/island-microgrid-demand-forecast"
description = "Build a day-ahead hourly demand forecasting model for a small island microgrid that generalizes to held-out weeks containing cold snaps, holiday-long-weekend effects, and ferry-day load bumps."
keywords = [ "forecasting", "time-series", "feature-engineering", "extrapolation", "energy",]

[metadata]
difficulty = "hard"
category = "data-processing"
tags = [ "forecasting", "time-series", "feature-engineering", "extrapolation", "energy",]
expert_time_estimate_min = 90.0
junior_time_estimate_min = 300.0
generator_model = "z-ai/glm-5.1"

[verifier]
timeout_sec = 900.0

[agent]
timeout_sec = 3600.0
network_mode = "no-network"

[environment]
build_timeout_sec = 600.0
cpus = 1
memory_mb = 2048
storage_mb = 10240

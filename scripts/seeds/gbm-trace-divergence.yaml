topic: A CPU gradient-boosting training script's per-round metric trace no longer matches the recorded
  reference after an installed library 'speed-up'; find and undo the change in the installed library.
shape: debugging against a reference trace; graded on hidden training configurations
agent_cannot_verify: The library change only alters results for some settings (e.g. ties in histogram
  binning or a min-child-weight boundary); the visible config can be matched by a narrow fix that still
  diverges on the hidden configs.
contract:
- 'entry point: python3 /app/train.py --config CONFIG writes /app/out/trace.csv (round, train_metric,
  valid_metric)'
- the fix lives in the installed library; train.py and the configs are unchanged
- traces must match the reference to 1e-9 for every round
- the library's public API and documented parameter semantics are kept
invisible_traps:
- trap: a fix that only restores the default config's path still diverges when ties occur in histogram
    binning
  stated_in: the library docs' binning rule, referenced by the instruction
- trap: the min-child-weight comparison is wrong only exactly at the boundary
  stated_in: the parameter's documented semantics (>=)
graded_instances: the agent gets the visible default config and its reference trace; the hidden tests
  run 6 other configs (sibling seeds for data and parameters, generated in tests/) against traces from
  the pristine library kept in tests/, and check the data generator is deterministic and seed-sensitive
instance_plan:
- instance: c1-c2
  quirks: 'binning ties: many'
  purpose: tie handling
- instance: c3-c4
  quirks: 'min-child-weight: exactly at'
  purpose: boundary comparison
- instance: c5-c6
  quirks: clipping with shrinkage
  purpose: operation order
dial: number of hidden configurations that must match the reference to 1e-9; fair range 3-8.
quirk_matrix:
  binning ties:
  - absent
  - some
  - many
  min-child-weight:
  - far
  - near
  - exactly at
  shrinkage and clipping:
  - no clipping
  - clipping
  - clipping with shrinkage
  mix: about 30% easy cells
reference_access: frozen_examples
quirk_evidence:
- quirk: binning ties
  evidence: the recorded reference trace for the practice configs; library docs on binning
- quirk: min-child-weight
  evidence: the recorded trace of a practice config that hits the limit
- quirk: shrinkage and clipping
  evidence: the recorded trace of a practice config with clipping; library changelog
public_tests: 'about 30%: the visible reference trace for the default config'
anti_cheese: hidden configs must match the pristine library's traces AND the fix must be in the installed
  library, not the script
ground_truth: the pristine library version kept in tests/ produces reference traces for the hidden configs.
checks:
- histogram binning tie handling
- the min-child-weight boundary (>= vs >)
- learning-rate shrinkage applied before vs after clipping
- the fix is in the installed library, not in the script
- the visible reference trace matches exactly
knobs:
- knob: hidden-edge coverage
  fairness: the library's docs state the intended semantics of each parameter
- knob: stale local tests
  fairness: the library's own unit test for binning is wrong; instruction says the documented semantics
    win
must_keep:
- the library's public API
environment: python:3.12-slim with a small pure-Python/numpy boosting library installed in site-packages;
  no network.
out_of_bounds:
- floating-point nondeterminism
- changes the docs do not describe
precheck:
- confirm the visible config alone does not reveal every changed behaviour
adjust_rules:
  too_easy:
  - add a config hitting two changed behaviours at once
  - remove the visible trace's second config hint
  too_hard:
  - add the binning tie case to the public tests
  - state the parameter semantics in the instruction too
